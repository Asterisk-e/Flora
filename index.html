<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7edca">
  <meta name="description" content="Flora — an offline-first workspace for documents, spreadsheets, presentations and tools.">
  <title>Flora — your creative workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-copy"><div class="brand-name">flora<span>.</span></div><div class="brand-caption">creative workspace</div></div>
        <button class="sidebar-compact-toggle" id="sidebar-compact-toggle" type="button" aria-label="Toggle compact sidebar" aria-pressed="false">Compact</button>
      </div>
      <button class="profile-switcher" id="profile-switcher" type="button" aria-label="Open profile settings">
        <span class="avatar" id="profile-avatar">F</span>
        <span class="profile-switcher-copy"><strong id="profile-name">Your profile</strong><small id="profile-status">Local profile</small></span>
        <span class="chevron">Profile</span>
      </button>
      <div class="sidebar-scroll">
        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="home"><span class="nav-short">HM</span><span class="nav-copy">Home</span></button>
          <button class="nav-item" data-view="files"><span class="nav-short">FI</span><span class="nav-copy">My files</span><span class="nav-count" id="file-count">0</span></button>
          <button class="nav-item" data-view="shared"><span class="nav-short">SH</span><span class="nav-copy">Shared with me</span></button>
        </nav>
        <div class="nav-label nav-label-spaced">CREATE</div>
        <nav class="main-nav" aria-label="Create applications">
          <button class="nav-item app-nav" data-app="doc"><span class="nav-short">AZ</span><span class="nav-copy">Azalea Docs</span></button>
          <button class="nav-item app-nav" data-app="sheet"><span class="nav-short">AM</span><span class="nav-copy">Amaryllis Sheets</span></button>
          <button class="nav-item app-nav" data-app="slides"><span class="nav-short">IR</span><span class="nav-copy">Iris Presentations</span></button>
          <button class="nav-item app-nav" data-app="note"><span class="nav-short">AN</span><span class="nav-copy">Anemone Notes</span></button>
          <button class="nav-item app-nav" data-app="board"><span class="nav-short">DA</span><span class="nav-copy">Dahlia Boards</span></button>
        </nav>
        <div class="nav-label nav-label-spaced">TOOLS</div>
        <nav class="main-nav" aria-label="Tools">
          <button class="nav-item" data-view="tools"><span class="nav-short">TL</span><span class="nav-copy">Tools</span></button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="storage-mini">
          <div class="storage-mini-head"><span>Storage</span><strong id="storage-percent">0%</strong></div>
          <div class="progress-track" id="storage-track"><span id="storage-progress"></span><span id="storage-progress-new"></span></div>
          <small id="storage-caption">Checking your space…</small>
        </div>
        <button class="nav-item settings-nav" data-view="settings"><span class="nav-short">ST</span><span class="nav-copy">Settings</span></button>
        <div class="sidebar-footer"><span>Stored on this device</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle navigation">Menu</button>
        <div class="breadcrumb"><span id="crumb-parent">Workspace</span><span class="crumb-slash">/</span><strong id="crumb-current">Home</strong></div>
        <div class="topbar-actions">
          <div class="online-status"><span>Offline ready</span></div>
          <button class="help-button" id="help-button" title="Help and shortcuts" aria-label="Help">Help</button>
          <button class="top-profile" id="top-profile" title="Profile settings"><span class="avatar avatar-small" id="top-avatar">F</span></button>
        </div>
      </header>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="export-formats.js"></script>
  <script src="app.js"></script>
</body>
</html>
