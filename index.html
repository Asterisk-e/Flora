<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7d6">
  <meta name="description" content="Flora — five creative tools. One workspace.">
  <title>Flora — Five Creative Tools</title>
  <link rel="stylesheet" href="assets/css/flora.css">
</head>
<body>
  <div class="flora-shell" id="flora-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Flora home"><span class="brand-mark">F</span><span class="brand-name">Flora</span></a>
      <nav class="nav-list" aria-label="Applications">
        <button class="nav-item active" data-open="home"><span class="nav-glyph">H</span><span class="nav-label">Home</span></button>
        <button class="nav-item" data-open="azalea"><span class="nav-glyph">A</span><span class="nav-label">Azalea</span></button>
        <button class="nav-item" data-open="iris"><span class="nav-glyph">I</span><span class="nav-label">Iris</span></button>
        <button class="nav-item" data-open="amaryllis"><span class="nav-glyph">S</span><span class="nav-label">Amaryllis</span></button>
        <button class="nav-item" data-open="lupine"><span class="nav-glyph">L</span><span class="nav-label">Lupine</span></button>
        <button class="nav-item" data-open="anemone"><span class="nav-glyph">P</span><span class="nav-label">Anemone</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-open="settings"><span class="nav-glyph">T</span><span class="nav-label">Settings</span></button>
        <div class="storage-card" title="Local browser storage estimate">
          <div class="storage-ring" id="storage-ring"><span id="storage-percent">—</span></div>
          <div class="storage-copy"><strong>Local workspace</strong><small id="storage-caption">Checking storage…</small></div>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true">Collapse sidebar</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Toggle navigation">Menu</button>
        <div class="breadcrumb"><span class="breadcrumb-kicker">FLORA WORKSPACE</span><strong id="page-title">Home</strong></div>
        <div class="topbar-actions">
          <button class="quiet-button" id="theme-toggle" type="button">Switch theme</button>
          <span class="local-status" id="save-status">Stored locally</span>
        </div>
      </header>
      <section class="workspace" id="workspace" aria-live="polite"></section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
